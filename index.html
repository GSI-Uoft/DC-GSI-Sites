
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DC GSI Sites</title>

  <script
    type="module"
    src="https://js.arcgis.com/5.1/embeddable-components/">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f8f7f3;
      color: #252a27;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 28px 24px 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 40px);
      font-weight: 500;
    }

    main {
      width: 100%;
      padding: 0 24px;
    }

    .map-container {
      width: 100%;
      overflow: hidden;
      border-radius: 6px;
    }

    arcgis-embedded-map {
      display: block;
      width: 100%;
      height: 75vh;
      min-height: 500px;
    }

    footer {
      padding: 24px;
      text-align: center;
      font-size: 13px;
      color: #68716a;
    }

    @media (max-width: 600px) {
      main {
        padding: 0 12px;
      }

      arcgis-embedded-map {
        height: 70vh;
        min-height: 450px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>DC GSI Sites</h1>
  </header>

  <main>
    <div class="map-container">
      <arcgis-embedded-map
        item-id="487828570fff41f392260f7285a4c6fd"
        theme="light"
        heading-enabled
        time-zone-label-enabled
        center="-77.01771256386219,38.9027072365651"
        scale="144447.638572"
        portal-url="https://www.arcgis.com"
        legend-enabled>
      </arcgis-embedded-map>
    </div>
  </main>

  <footer>
    Isabel Thompson
  </footer>
</body>
</html>
